name: robust_school_management_app
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^0.13.6
  provider: ^6.1.2
  flutter_secure_storage: ^9.0.0
  file_picker: ^6.1.1
  dio: ^5.4.0
  http_parser: ^4.0.2
  url_launcher: ^6.3.1
  path_provider: ^2.0.2
  open_file: ^3.2.2
  permission_handler: ^11.3.1

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10
  
  



flutter:
  uses-material-design: true

  assets:
    - assets/logo_white.png
    - assets/logo_black.png
    - assets/logo.png

  fonts:
    - family: ABeeZee
      fonts:
        - asset: assets/fonts/ABeeZee.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: YsabeauOffice
      fonts:
        - asset: assets/fonts/YsabeauOffice.ttf
    - family: AppleSDGothicNeo
      fonts:
flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo_black.png" 
flutter_native_splash:
  color: "#0E2C5A" # couleur de fond
  image: assets/logo_white.png # ton logo
  android: true
  ios: true
