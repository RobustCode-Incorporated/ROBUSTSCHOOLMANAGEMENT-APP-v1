name: robust_school_management_app
description: "Robust School : notes, emploi du temps et documents pour élèves et enseignants."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  dio: ^5.11.1
  http_parser: ^4.0.2
  path_provider: ^2.1.6
  open_file: ^4.0.0
  intl: ^0.20.2

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10
  
  



flutter:
  uses-material-design: true

  assets:
    - assets/logo_white.png
    - assets/logo_black.png
    - assets/logo.png

  fonts:
    - family: ABeeZee
      fonts:
        - asset: assets/fonts/ABeeZee.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: YsabeauOffice
      fonts:
        - asset: assets/fonts/YsabeauOffice.ttf
    - family: AppleSDGothicNeo
      fonts:
flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo_black.png" 
flutter_native_splash:
  color: "#0E2C5A" # couleur de fond
  image: assets/logo_white.png # ton logo
  android: true
  ios: true
